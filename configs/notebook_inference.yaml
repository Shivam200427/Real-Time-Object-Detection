augmentation:
  color_jitter: 0.3
  crop_scale:
  - 0.8
  - 1.0
  horizontal_flip: 0.5
  normalize_rgb:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  normalize_thermal:
    mean:
    - 0.5
    std:
    - 0.25
  random_crop: true
dataset:
  img_size:
  - 640
  - 640
  name: llvip
  num_workers: 4
  root: data/llvip_processed
  test_split: 0.1
  train_split: 0.8
  val_split: 0.1
head:
  max_detections: 100
  nms_threshold: 0.5
  num_convs: 4
  score_threshold: 0.3
  use_centerness: true
inference:
  device: auto
  nms_threshold: 0.5
  score_threshold: 0.4
  weights: outputs/checkpoints/best_model.pth
logging:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  log_interval: 50
  results_dir: outputs/results
  save_interval: 5
  tensorboard: true
loss:
  centerness_weight: 1.0
  cls_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  reg_weight: 1.0
model:
  backbone: resnet34
  class_names:
  - person
  - car
  - bicycle
  - dog
  - other
  fpn_channels: 256
  freeze_backbone_stages: 2
  fusion_type: attention
  num_classes: 5
  pretrained: true
training:
  batch_size: 8
  epochs: 50
  learning_rate: 0.001
  scheduler: cosine
  step_gamma: 0.1
  step_milestones:
  - 30
  - 40
  warmup_iterations: 1000
  weight_decay: 0.0001
